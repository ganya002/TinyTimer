<!DOCTYPE html>
<html>
<head>
    <title>TinyTimer</title>
    <style>
        body { font-family: system-ui; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #1a1a2e; color: white; }
        #timer { font-size: 5rem; }
        button { font-size: 1.5rem; padding: 10px 30px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div>
        <div id="timer">05:00</div>
        <button onclick="start()">Start</button>
        <button onclick="reset()">Reset</button>
    </div>
    <script>
        let time = 300, interval;
        function start() { interval = setInterval(() => { time--; update(); if(time <= 0) clearInterval(interval); }, 1000); }
        function reset() { time = 300; update(); clearInterval(interval); }
        function update() { document.getElementById('timer').textContent = String(Math.floor(time/60)).padStart(2,'0') + ':' + String(time%60).padStart(2,'0'); }
    </script>
</body>
</html>
